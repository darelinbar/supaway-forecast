name: Update forecast

on:
  schedule:
    # Target: about 11:00, 17:00 and 19:00 Israel time. GitHub cron runs in UTC and Israel moves between
    # UTC+2 and UTC+3, so both possible UTC times are scheduled and the "Check time" step skips the wrong one.
    # Starting 20 minutes early leaves room for GitHub's usual scheduling delay.
    - cron: '40 7,8,13,14,15,16 * * *'
  workflow_dispatch:
  # On pull requests the fetch runs as a test only; nothing is committed.
  pull_request:

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check time
        id: when
        run: |
          now=$(TZ=Asia/Jerusalem date +%H%M); now=$((10#$now))
          if [ "${{ github.event_name }}" != "schedule" ] || { [ $now -ge 1030 ] && [ $now -lt 1130 ]; } || { [ $now -ge 1630 ] && [ $now -lt 1730 ]; } || { [ $now -ge 1830 ] && [ $now -lt 1930 ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Israel time is $now; this is the other daylight-saving slot, skipping."; echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'yes'
      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'yes'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.when.outputs.run == 'yes'
      - run: npx playwright install --with-deps chromium
        if: steps.when.outputs.run == 'yes'
      - name: Fetch forecast
        if: steps.when.outputs.run == 'yes'
        id: fetch
        run: node scripts/fetch.mjs
        continue-on-error: true
      - name: Show fetched data
        if: steps.when.outputs.run == 'yes'
        run: head -c 3000 docs/data.json
      - name: Commit new data
        if: steps.when.outputs.run == 'yes' && (github.event_name != 'pull_request')
        run: |
          if git diff --quiet docs/data.json; then echo "no change"; exit 0; fi
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Update forecast data"
          git push
      - name: Report repeated source failures
        if: steps.when.outputs.run == 'yes' && (steps.fetch.outcome == 'failure')
        run: |
          echo "The fetch step failed. Check the log above; the page keeps showing the last data or the Open-Meteo backup."
          exit 1
